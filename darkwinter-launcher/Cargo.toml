# Defines launcher workspace members and shared package dependencies.
[workspace]
resolver = "3"
members = [
    "crates/launcher-common",
    "crates/launcher-core",
    "crates/launcher-profile",
    "crates/launcher-java",
    "crates/launcher-hardware",
    "crates/launcher-ui",
    "crates/launcher-app",
]
default-members = ["crates/launcher-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1.0"
atomicwrites = "0.4.4"
base64 = "0.22.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "alloc"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
fs2 = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.23"
wait-timeout = "0.2.1"
zeroize = "1.8"
launcher-common = { path = "crates/launcher-common" }
launcher-core = { path = "crates/launcher-core" }
launcher-profile = { path = "crates/launcher-profile" }
launcher-java = { path = "crates/launcher-java" }
launcher-hardware = { path = "crates/launcher-hardware" }
launcher-ui = { path = "crates/launcher-ui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

