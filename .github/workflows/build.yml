# Build the Windows x64 Fabric/WKE distribution with Java 25 and verify its package.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build and verify WKE package
        shell: pwsh
        run: .\gradlew.bat --no-daemon build wkeVerifyPackage
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
