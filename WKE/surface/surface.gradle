// Independent Java policy plus thin common/client Minecraft adapters.
sourceSets.named('main') {
    java.srcDir('WKE/surface/java')
    java.srcDir('modules/wke/surface/main/java')
    resources.srcDir('modules/wke/surface/main/resources')
}
sourceSets.named('client') {
    java.srcDir('modules/wke/surface/client/java')
    resources.srcDir('modules/wke/surface/client/resources')
}
def surfaceChecks=layout.buildDirectory.dir('WKE/surface-check-classes')
tasks.register('wkeCompileSurfaceChecks',JavaCompile) {
    group='wke'
    source fileTree('WKE/surface/java') { include '**/*.java' }
    source fileTree('WKE/surface/tests') { include '**/*.java' }
    classpath=files()
    destinationDirectory=surfaceChecks
    options.release=25;options.encoding='UTF-8'
    javaCompiler=javaToolchains.compilerFor { languageVersion=JavaLanguageVersion.of(25) }
}
tasks.register('wkeVerifySurface',JavaExec) {
    group='verification';dependsOn 'wkeCompileSurfaceChecks'
    classpath=files(surfaceChecks)
    mainClass='com.winterkore.engine.surface.SnowSurfaceChecks'
    javaLauncher=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(25) }
}

tasks.register('wkeVerifySurfaceGeometry',JavaExec) {
    group='verification';dependsOn 'wkeCompileSurfaceChecks'
    classpath=files(surfaceChecks)
    mainClass='com.winterkore.engine.surface.SnowSurfaceGeometryChecks'
    javaLauncher=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(25) }
}


// Isolated exact pressure certificates; does not enable the shortcut in production.
tasks.register('wkeVerifyConstantFieldBins',JavaExec) {
    group='verification';dependsOn 'wkeCompileSurfaceChecks'
    classpath=files(surfaceChecks)
    mainClass='com.winterkore.engine.surface.SnowConstantFieldBinsChecks'
    javaLauncher=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(25) }
}

// Explicit host/codec contract checks do not create a world or load a gameplay fixture.
