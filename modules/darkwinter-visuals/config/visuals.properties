# Define default visual quality, atmosphere, film and celestial settings.
# DarkWinter Visuals RC2. The only live settings file is run/config/darkwinter/visuals.properties.
# Reloaded on the render thread once per second. No shader commands required.
enabled=true
shadows=true
quality=BALANCED
volume=true
atmosphere=true
overworldOnly=true
shadowStrength=0.50
depthBiasBlocks=0.018
normalOffsetBlocks=0.012
fogDensity=0.0009
maxFog=0.055
shaftStrength=0.090
rayDistance=60
# Fixed artistic profile. No automatic exposure from snow, sky or screen brightness.
filmStrength=1.0
saturation=0.72
coldness=0.34
exposure=0.90
grain=0.025
chromaBleed=0.34
vignette=0.16
scanlines=0.012
# Subtle cold film: reference pixels at 1080p, alternating fields, finite frame traces.
chromaticAberration=0.60
interlaceStrength=0.12
shutterStrength=0.18
stepPrintStrength=0.12
stepPrintFps=18
# 0 normal, 1 shadow map, 2 shadow visibility, 3 rays, 4 distance, 5 normals, 6 FILM PASS marker.
debug=0
# Diagnostics only. freezeSun stops just this renderer's light direction; vanilla sun still moves.
freezeSun=false
flipDepthY=false
flipShadowY=false

# Visual sky only: make the Sun and Moon move slower without changing server/world time.
visualDayLengthMultiplier=4.0
sunSizeMultiplier=2.6
moonSizeMultiplier=3.2
sunDiscBrightness=1.12

# Northern Baffin Island; shared server compass for sky and wind.
latitude=73.0
longitude=-80.0
utcOffsetHours=-5.0
northRotation=0.0
