// Configure the Fabric mod, embedded visual module, dependencies and opt-in verification tasks.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"dark-winter" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "dark-winter"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Embedded, pinned transport library; native code ships in the build, never fetched on joining.
	implementation("dev.onvoid.webrtc:webrtc-java:0.20.0") { transitive = false }
	include("dev.onvoid.webrtc:webrtc-java:0.20.0") { transitive = false }
	runtimeOnly("dev.onvoid.webrtc:webrtc-java:0.20.0:windows-x86_64") { transitive = false }
	include("dev.onvoid.webrtc:webrtc-java:0.20.0:windows-x86_64") { transitive = false }
    // Original pinned Iroh JVM/native artifact, loaded only by explicit network-room operations.
    implementation("computer.iroh:iroh:1.2.0@jar") { transitive = false }
    include("computer.iroh:iroh:1.2.0@jar") { transitive = false }
    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.2.21") { transitive = false }
    include("org.jetbrains.kotlin:kotlin-stdlib:2.2.21") { transitive = false }
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0") { transitive = false }
    include("org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0") { transitive = false }
    // JNA 5.17.0 is supplied by Minecraft 26.3; do not bundle a conflicting native dispatcher.

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Include the visual renderer source module.
apply from: 'modules/darkwinter-visuals/module.gradle'

// Bind diagnostic reports to the exact production source and assets.
apply from: 'gradle/performance.gradle'

// Optional ignored profile affects only the normal development client.
apply from: 'gradle/client-runtime.gradle'

// Load optional local development tasks only when their infrastructure is installed.
def developmentScript = file('tools/gradle/development.gradle')
if (file('tools').isDirectory() && file('tests').isDirectory() && developmentScript.isFile()) {
    apply from: developmentScript
}

// Opt-in standalone Java/C++ voxel experiment. No production classes or libraries added.
apply from: 'gradle/voxel-faces.gradle'

// Detached block-light prefix prototype; native compilation requires an explicit opt-in task.
apply from: 'gradle/light-prefix.gradle'

// Native C++ editor uses a separate opt-in exact-generation worker.
apply from: 'gradle/biome-editor.gradle'

// Explicit private native A/B captures never participate in normal builds or launches.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['compileShadowReuseClientTest', 'runShadowReuseControlClientTest', 'runShadowReuseCandidateClientTest'] }) {
    apply from: 'tests/shadow-reuse-vulkan/shadow-reuse.gradle'
}

// Private JFR and cache-invalidation diagnostics are isolated from the uninstrumented A/B fixture.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['compileShadowReuseDiagnosticClientTest', 'runShadowReuseDiagnosticClientTest'] }) {
    apply from: 'tests/shadow-reuse-diagnostics/shadow-reuse-diagnostics.gradle'
}

// Native input and frame-latency diagnostics are absent from normal builds and launches.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['compileBlockBreakFrameClientTest', 'runBlockBreakFrameControlClientTest', 'runBlockBreakFrameCandidateClientTest', 'runBlockBreakFrameProfileClientTest', 'runBlockBreakFrameTintControlClientTest', 'runBlockBreakFrameTintCandidateClientTest'] }) {
    apply from: 'tests/block-break-frame/block-break-frame.gradle'
}

// Private native lighting checks load only for their explicit verification aliases.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['compileLightParallelProbe', 'runLightParallelControlClientTest', 'runLightParallelCandidateClientTest', 'runLightParallelPerfControlClientTest', 'runLightParallelPerfCandidateClientTest'] }) {
    apply from: 'tests/light-parallel/light-parallel.gradle'
}

// Shared WKE source paths keep the deferred standalone host buildable.
apply from: 'WKE/gradle/source-layout.gradle'
// Independent voxel core and explicit standalone verification tasks.
apply from: 'gradle/core.gradle'

// WinterKore Engine: independent native sources and packaged Fabric integration.
apply from: 'WKE/gradle/wke.gradle'
apply from: 'WKE/surface/surface.gradle'

if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'wkeMigrateRuntime' }) {
    apply from: 'WKE/build-tools/migrate-runtime.gradle'
}

// Private GPU evidence for WKE world rendering; absent from normal builds.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['wkeRendererCompileClientTest','wkeRendererVerifyClient'] }) {
    apply from: 'tests/wke-renderer/wke-renderer.gradle'
}

// Isolated checks for real graphics controls, GPU atlas mips and film output.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['renderSettingsCompileClientTest','renderSettingsVerifyClient'] }) {
    apply from: 'tests/render-settings/render-settings.gradle'
}

// Invocation-owned integrated forest, GPU filtering/TAA, snow and acoustic validation.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['wkeSceneCompileClientTest','wkeSceneVerifyClient','wkeSceneTemporalWeightsClient','wkeSceneGpuPassTimingClient','wkeSceneCloudFidelityClient'] }) {
    apply from: 'tests/wke-scene/wke-scene.gradle'
}

// Preserve authored texture masters while packaging a complete block-atlas mip chain.
apply from: 'gradle/texture-mips.gradle'

// Separate read-only post-run vegetation diagnostics.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'wkeAnalyzeVegetationTrace' }) {
    apply from: 'tests/wke-snow-v2/analyze-vegetation.gradle'
}

// Real Test-world snow/vegetation regression; baseline uses only the pinned production JAR.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last().startsWith('wkeSnowV2') }) {
    apply from: 'tests/wke-snow-v2/wke-snow-v2.gradle'
}

// Isolated visual regression for full-screen menu backgrounds and the pause sidebar.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['uiEdgesVerifyClient','uiEdgesCompileClientTest'] }) {
    apply from: 'tests/ui-edges/ui-edges.gradle'
}

// Prepared forest audio is imported only on explicit request.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'forestAudioImport' }) {
    apply from: 'gradle/forest-audio-import.gradle'
}
