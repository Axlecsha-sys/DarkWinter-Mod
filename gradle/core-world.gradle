tasks.register('coreCheckScene') {
    group='verification';dependsOn 'coreBuildWorld'
    notCompatibleWithConfigurationCache('Native scene boundary and format regression.')
    doLast {
        File bin=file('build/core/scene-checks/scene-checks.exe');bin.parentFile.mkdirs()
        def compiler=file('build/voxel-faces/toolchains/zig-0.14.1/zig.exe')
        def args=[compiler.absolutePath,'c++','-std=c++20','-O2','-ffp-contract=off','-pthread','-static','-target','x86_64-windows-gnu']
        args+=['native/darkwinter-client/checks/scene-checks.cpp','WKE/runtime/src/scene.cpp','WKE/core/src/core.cpp','WKE/core/src/format.cpp'].collect{file(it).absolutePath}
        worldExecute(args+['-o',bin.absolutePath])
        worldExecute([bin.absolutePath,projectDir.absolutePath,file('build/core/scene-checks/'+worldStamp).absolutePath])
