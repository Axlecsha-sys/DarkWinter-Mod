tasks.named('coreAuditWorld'){dependsOn 'coreCheckScene'}
tasks.register('coreRunWorld') {
    group='application';dependsOn 'coreAuditWorld'
    notCompatibleWithConfigurationCache('Interactive native world launch.')
    doLast {
        def report=file('build/core/world-interactive/'+worldStamp);report.mkdirs()
        def builder=new ProcessBuilder([new File(worldDist,'DarkWinter.exe').absolutePath,'--play','--report',report.absolutePath]).directory(worldDist)
        def environment=new HashMap(builder.environment());builder.environment().clear()
        ['SystemRoot','WINDIR','TEMP','TMP','USERPROFILE','LOCALAPPDATA','APPDATA'].each{key->if(environment[key]!=null)builder.environment()[key]=environment[key]}
        builder.environment()['PATH']=new File(System.getenv('SystemRoot'),'System32').absolutePath
        def process=builder.start();Thread.sleep(2500)
        if(new File(report,'error.json').isFile())throw new GradleException(new File(report,'error.json').getText('UTF-8'))
        if(!process.isAlive())throw new GradleException('Native world exited during startup.')
        file('build/core/latest-world-interactive.json').text=JsonOutput.prettyPrint(JsonOutput.toJson([started:true,pid:process.pid(),running:true,javaEnvironment:false,report:report.absolutePath]))+'\n'
        logger.lifecycle('CORE_WORLD_STARTED '+process.pid())
    }
}

