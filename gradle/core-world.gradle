        args+=['native/darkwinter-client/checks/player-checks.cpp','native/darkwinter-client/src/player.cpp','WKE/runtime/src/scene.cpp','WKE/core/src/core.cpp','WKE/core/src/format.cpp'].collect{file(it).absolutePath}
        worldExecute(args+['-o',bin.absolutePath])
        worldExecute([bin.absolutePath,worldDist.absolutePath,file('build/core/player-checks/'+worldStamp).absolutePath])
    }
}
tasks.register('coreVerifyPlayer'){
    group='verification';dependsOn 'coreCheckPlayer'
    notCompatibleWithConfigurationCache('Actual native player input, GPU, pause and save/reopen.')
    doLast{
        File report=file('build/core/player-runs/'+worldStamp);report.mkdirs()
        worldExecute([new File(worldDist,'DarkWinter.exe').absolutePath,'--hidden','--verify','--exercise-player','--frames','720','--report',report.absolutePath])
        def result=new JsonSlurper().parse(new File(report,'stage6.json'))
        if(!result.completed||!result.reload||!result.pause)throw new GradleException('Player exercise failed')
        file('build/core/latest-player.json').text=JsonOutput.prettyPrint(JsonOutput.toJson([completed:true,run:report.absolutePath,result:result]))+'\n'
    }
}
tasks.named('coreAuditWorld'){dependsOn 'coreVerifyPlayer'}
