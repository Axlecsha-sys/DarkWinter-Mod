    group='verification';dependsOn 'coreVerifyWorld'
    notCompatibleWithConfigurationCache('Native package and owned no-Java process checks.')
    doLast {
        File audit=file('build/core/world-audits/'+worldStamp)
        worldExecute(['python',new File(nativeWorldSource,'build-tools/audit-world.py').absolutePath,projectDir.absolutePath,audit.absolutePath])
        file('build/core/latest-world-audit.json').text=JsonOutput.prettyPrint(JsonOutput.toJson([completed:true,run:audit.absolutePath]))+'\n'
    }
