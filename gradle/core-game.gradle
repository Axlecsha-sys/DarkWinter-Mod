tasks.register('coreRunGame'){
 group='application';dependsOn 'coreAuditGame'
 notCompatibleWithConfigurationCache('Interactive native game.')
 doLast{
  File report=file('build/core/game-interactive/'+gameStamp);report.mkdirs()
  def builder=new ProcessBuilder([new File(gameDist,'DarkWinter.exe').absolutePath,'--report',report.absolutePath,'--saves',file('build/core/world-client/saves').absolutePath]).directory(gameDist)
  def inherited=new HashMap(builder.environment());builder.environment().clear()
  ['SystemRoot','WINDIR','TEMP','TMP','USERPROFILE','LOCALAPPDATA','APPDATA'].each{key->if(inherited[key]!=null)builder.environment()[key]=inherited[key]}
  builder.environment()['PATH']=new File(System.getenv('SystemRoot'),'System32').absolutePath
  def process=builder.start();Thread.sleep(2000)
  if(new File(report,'error.json').isFile())throw new GradleException(new File(report,'error.json').getText('UTF-8'))
  if(!process.isAlive())throw new GradleException('Native game exited during startup')
  file('build/core/latest-game-interactive.json').text=JsonOutput.prettyPrint(JsonOutput.toJson([started:true,pid:process.pid(),report:report.absolutePath]))+'\n'
  logger.lifecycle('CORE_GAME_STARTED '+process.pid())
 }
}
