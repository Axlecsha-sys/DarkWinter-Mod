tasks.register('coreBuildGame'){
 group='build';dependsOn 'coreCompileGame','coreClientHeaders','corePackBiome','coreCompileWorldShader','corePackSounds'
 description='Build native DarkWinter menus, player and procedural streaming world.'
 notCompatibleWithConfigurationCache('Native package from owned exported assets.')
 doLast{
  gameDist.mkdirs();def base=file('build/core/world-client')
  // Preserve the player's existing preferences when opening this separate build.
  File settings=new File(gameDist,'settings.cfg')
  if(!settings.isFile()) {
   File previous=['v12','v11','v10','v9','v8'].collect{file('build/core/game-client-'+it+'/settings.cfg')}.find{it.isFile()}
   if(previous!=null)java.nio.file.Files.copy(previous.toPath(),settings.toPath())
  }
  ['world.dwv','assets.dwa','biome.json','bvh.json','camera.txt','ui.dwu','ui_regular.ttf','ui_symbols.ttf','license.txt','ui-sources.json','ui-languages.tsv','ui-text.tsv','ui-game-rules.tsv','ui-language-sources.json','attribution.html','licenses.html','accessibility.html','notices-sources.json','footsteps.dws','trace.comp.spv','collision.dwc','avatar.dwp','player-assets.json'].each{n->java.nio.file.Files.copy(new File(base,n).toPath(),new File(gameDist,n).toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)}
  ['raster.vert.spv','raster.frag.spv','shadow.vert.spv','shadow.frag.spv','depth_resolve.frag.spv'].each{n->java.nio.file.Files.copy(new File(base,n).toPath(),new File(gameDist,n).toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)}
  copy{from new File(base,'visuals');into new File(gameDist,'visuals')}
  copy{from new File(base,'licenses');into new File(gameDist,'licenses')}
  copy{from new File(base,'notices');into new File(gameDist,'notices')}
  File vmaNotice=new File(gameDist,'licenses/VulkanMemoryAllocator-MIT.txt')
  vmaNotice.parentFile.mkdirs()
  java.nio.file.Files.copy(new File(gameVma,'LICENSE.txt').toPath(),vmaNotice.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
  java.nio.file.Files.copy(new File(gameSource,'README_WORLD_RU.txt').toPath(),new File(gameDist,'README_RU.txt').toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)

  def hashes=[:];['DarkWinter.exe','world.dwv','assets.dwa','ui.dwu','trace.comp.spv','ui_regular.ttf','ui_symbols.ttf','ui-languages.tsv','ui-text.tsv','ui-game-rules.tsv','ui-language-sources.json','attribution.html','licenses.html','accessibility.html','notices-sources.json','collision.dwc','avatar.dwp','footsteps.dws'].each{hashes[it]=gameSha(new File(gameDist,it))}
  ['raster.vert.spv','raster.frag.spv','shadow.vert.spv','shadow.frag.spv','depth_resolve.frag.spv'].each{hashes[it]=gameSha(new File(gameDist,it))}
  fileTree(new File(gameDist,'visuals')).files.findAll{it.isFile()}.sort{it.name}.each{hashes['visuals/'+it.name]=gameSha(it)}
  hashes['licenses/VulkanMemoryAllocator-MIT.txt']=gameSha(vmaNotice)
  new File(gameDist,'build-receipt.json').text=JsonOutput.prettyPrint(JsonOutput.toJson([schema:13,completed:true,artifactSha256:hashes,dependencies:[vma:[version:'3.3.0',license:'MIT',headerSha256:gameSha(new File(gameVma,'vk_mem_alloc.h'))]],appearance:[profile:'clean forest with exact snow joins',materialOverrides:new JsonSlurper().parse(file('native/darkwinter-client/export/material-overrides.json'))],renderer:'Vulkan raster + original DarkWinter visual graph',runtime:'Native C++/Win32/Vulkan; no JVM',generator:4,residentSections:1183,coordinateExtentBlocks:65536]))+'\n'
 }
}
