def gameStamp=new Date().format('yyyyMMdd-HHmmss-SSS')
def gameRun=file('build/core/game-runs/'+gameStamp)
def gameExecute={List<String> command->
 def process=new ProcessBuilder(command).directory(projectDir).redirectErrorStream(true).start()
 String output=process.inputStream.getText('UTF-8');int code=process.waitFor()
 if(!output.isBlank())logger.lifecycle(output.trim())
 if(code!=0)throw new GradleException('Native game command failed ('+code+'): '+command[0])
 output.trim()
}
// Keep native build diagnostics inside the project for reproducible UI review.
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('core') }) {
 def nativeLog=file('build/core/native-build.log');nativeLog.parentFile.mkdirs();nativeLog.text=''
 def writeNativeLog={CharSequence message->synchronized(nativeLog){nativeLog.append(message.toString(),'UTF-8')}}
 logging.addStandardOutputListener(writeNativeLog as org.gradle.api.logging.StandardOutputListener)
 logging.addStandardErrorListener(writeNativeLog as org.gradle.api.logging.StandardOutputListener)
}
def gameSha={File f->java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()}
def gameCompile={List<String> source,File binary,boolean windowed->
 def compiler=file('build/voxel-faces/toolchains/zig-0.14.1/zig.exe')
 if(gameSha(compiler)!='1ddf230367e07738c4a769eae66c1db7469e37bd520e81c86356453d0db2b9fd')throw new GradleException('Compiler integrity')
 binary.parentFile.mkdirs()
 def args=[compiler.absolutePath,'c++','-std=c++20','-O3','-fno-fast-math','-ffp-contract=off','-Wall','-Wextra','-Wpedantic','-Wno-missing-field-initializers','-pthread','-static','-target','x86_64-windows-gnu','-DUNICODE','-D_UNICODE','-DNOMINMAX','-DVMA_VULKAN_VERSION=1001000','-DVMA_STATIC_VULKAN_FUNCTIONS=0','-DVMA_DYNAMIC_VULKAN_FUNCTIONS=1','-isystem',gameVma.absolutePath,'-I'+file('build/core/deps/Vulkan-Headers-1.3.296/include').absolutePath]
 args+=source.collect{wkeNativeFile(it).absolutePath}
 args+=['WKE/core/src/core.cpp','WKE/core/src/format.cpp'].collect{file(it).absolutePath}
 if(windowed)args+='-Wl,--subsystem,windows'
 gameExecute(args+['-luser32','-lshell32','-lgdi32','-lwinmm','-o',binary.absolutePath])
}
tasks.register('coreVmaHeaders') {
 group='build';description='Fetch hash-pinned official Vulkan Memory Allocator headers and MIT notice.'
 notCompatibleWithConfigurationCache('Explicit verified native dependency preparation.')
 def manifest=file('native/darkwinter-client/vma.json')
 inputs.file(manifest);outputs.dir(gameVma)
 doLast {
  def data=new JsonSlurper().parse(manifest)
  data.files.each {String path,def spec->
   File target=new File(gameVma,path)
   if(!target.isFile()||gameSha(target)!=spec.sha256) {
    def connection=new URI(data.base+spec.path).toURL().openConnection()
    connection.connectTimeout=15000;connection.readTimeout=20000
    byte[] bytes=connection.inputStream.withCloseable{it.readAllBytes()}
    if(bytes.length!=spec.bytes||java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()!=spec.sha256)throw new GradleException('VMA dependency integrity mismatch: '+path)
    target.parentFile.mkdirs()
    File staged=new File(target.parentFile,target.name+'.download')
    staged.bytes=bytes
    java.nio.file.Files.move(staged.toPath(),target.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
   }
  }
 }
}
