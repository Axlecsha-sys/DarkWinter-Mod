tasks.register('coreVerifyGame'){
 group='verification';dependsOn 'coreBuildGame'
 notCompatibleWithConfigurationCache('Owned native integration and persistence checks.')
 doLast{
  gameRun.mkdirs()
  ['player-checks','player-transition-checks','generation-checks','ui-checks','world-ui-checks'].each{name->
   def sources=['native/darkwinter-client/checks/'+name+'.cpp','native/darkwinter-client/src/player.cpp','WKE/runtime/src/scene.cpp']
   if(name=='ui-checks')sources+=['native/darkwinter-client/src/ui.cpp']
   if(name=='generation-checks')sources+=['native/darkwinter-client/src/generation.cpp','native/darkwinter-client/src/streaming.cpp']
   File binary=new File(gameRun,name+'.exe');gameCompile(sources,binary,false)
   gameExecute([binary.absolutePath,gameDist.absolutePath,new File(gameRun,name).absolutePath])
  }
  File report=new File(gameRun,'ui');report.mkdirs()
  gameExecute([new File(gameDist,'DarkWinter.exe').absolutePath,'--hidden','--verify','--exercise-ui','--frames','720','--report',report.absolutePath])
  def result=new JsonSlurper().parse(new File(report,'stage6.json'))
  if(!result.completed||!result.fullscreen||!result.windowRestored||!result.pause||!result.firstPerson||result.cancelledLoads<1||!result.reload||result.generatedColumns<=81||result.residentSections!=1183||result.oracleRays<=300)throw new GradleException('Native game exercise incomplete')
  file('build/core/latest-game.json').text=JsonOutput.prettyPrint(JsonOutput.toJson([completed:true,dist:gameDist.absolutePath,run:gameRun.absolutePath,result:result]))+'\n'
  logger.lifecycle('CORE_GAME_PASS '+gameRun.absolutePath)
 }
}
