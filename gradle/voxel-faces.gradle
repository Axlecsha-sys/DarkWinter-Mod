}


def fabricSourceCache = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1/net.fabricmc.fabric-api')
tasks.register('blockMeshInspectFabricSources') {
    group = 'verification'
    description = 'Inspect installed Fabric renderer source dependencies for the chunk mesh adapter.'
    dependsOn(branchCheck)
    notCompatibleWithConfigurationCache('Read-only installed source JAR audit.')
    doLast {
        def dependencies = [
            'fabric-renderer-api-v1/17.0.16+79385d0b5d/59980ad0bc042938c848aaa9fe52f1243c130860/fabric-renderer-api-v1-17.0.16+79385d0b5d-sources.jar',
            'fabric-renderer-indigo/9.1.24+b9d63e335d/a108d79ffb93cddb95ee1209c824cfd01279b1cc/fabric-renderer-indigo-9.1.24+b9d63e335d-sources.jar'
        ]
        File folder = new File(repoRoot, 'build/voxel-faces/inspection/fabric')
        folder.mkdirs()
        dependencies.each { relative ->
            File archive = new File(fabricSourceCache, relative)
            if (!archive.isFile()) throw new GradleException('Installed source dependency missing: ' + relative)
            def zip = new java.util.zip.ZipFile(archive)
            try {
                zip.entries().each { entry ->
                    if (!entry.directory && entry.name.endsWith('.java') &&
                            (entry.name.contains('/renderer/mesh/') || entry.name.contains('/renderer/render/') ||
                             entry.name.contains('/renderer/block/render/') || entry.name.endsWith('/QuadEmitter.java') ||
                             entry.name.endsWith('/QuadView.java'))) {
                        File target = new File(folder, entry.name).canonicalFile
                        if (!target.toPath().startsWith(folder.canonicalFile.toPath())) throw new GradleException('Unsafe source path')
                        target.parentFile.mkdirs()
                        zip.getInputStream(entry).withCloseable { input ->
                            Files.copy(input, target.toPath(), StandardCopyOption.REPLACE_EXISTING)
                        }
                        logger.lifecycle('Fabric renderer audit: ' + entry.name)
                    }
                }
            } finally { zip.close() }
        }
    }
}

tasks.register('voxelFacesInspectRendererSources') {
    group = 'verification'
    description = 'Copy selected Minecraft 26.3 renderer sources to ignored build for precise integration audit.'
    dependsOn(branchCheck)
    notCompatibleWithConfigurationCache('Local source JAR audit is opt-in and read-only.')
    doLast {
        File jar = new File(repoRoot, '.gradle/loom-cache/minecraftMaven/net/minecraft/minecraft-clientOnly-7e9a32a5b8/26.3/minecraft-clientOnly-7e9a32a5b8-26.3-sources.jar')
        if (!jar.isFile()) throw new GradleException('Pinned Minecraft 26.3 source JAR not found.')
        def paths = [
            'net/minecraft/client/renderer/chunk/SectionCompiler.java',
            'com/mojang/blaze3d/vertex/BufferBuilder.java',
            'com/mojang/blaze3d/vertex/VertexConsumer.java',
            'com/mojang/blaze3d/vertex/QuadInstance.java',
            'net/minecraft/client/resources/model/geometry/BakedQuad.java',
            'com/mojang/blaze3d/vertex/ByteBufferBuilder.java',
            'com/mojang/blaze3d/vertex/MeshData.java',
            'com/mojang/blaze3d/vertex/DefaultVertexFormat.java',
            'net/minecraft/client/renderer/block/BlockQuadOutput.java',
            'net/minecraft/client/renderer/block/FluidRenderer.java',
            'net/minecraft/client/renderer/SectionBufferBuilderPack.java',
            'net/minecraft/client/renderer/block/BlockModelLighter.java',
            'net/minecraft/client/renderer/block/model/BakedQuad.java',
            'net/minecraft/client/renderer/block/model/BlockModelPart.java',
            'net/minecraft/client/renderer/chunk/ChunkSectionLayer.java',
            'net/minecraft/client/renderer/block/ModelBlockRenderer.java',
            'net/minecraft/client/renderer/chunk/RenderSectionRegion.java',
            'net/minecraft/client/renderer/chunk/SectionCopy.java',
            'net/minecraft/world/level/block/Block.java',
            'net/minecraft/world/level/block/state/BlockBehaviour.java',
            'net/minecraft/world/level/block/state/BlockState.java',
            'net/minecraft/client/renderer/block/model/BlockStateModel.java'
        ]
        File folder = new File(repoRoot, 'build/voxel-faces/inspection')
        folder.mkdirs()
        def zip = new java.util.zip.ZipFile(jar)
        try {
            paths.each { path ->
                def entry = zip.getEntry(path)
                if (entry != null) {
                    File output = new File(folder, path.substring(path.lastIndexOf('/') + 1))
                    zip.getInputStream(entry).withCloseable { input ->
                        Files.copy(input, output.toPath(), StandardCopyOption.REPLACE_EXISTING)
                    }
                    logger.lifecycle('Renderer source audit: ' + output.name)
                } else logger.lifecycle('Renderer source not in this JAR: ' + path)
            }
        } finally {
            zip.close()
        }
    }
}
